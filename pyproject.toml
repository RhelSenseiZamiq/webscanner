[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "webscanner"
version = "0.1.0"
requires-python = ">=3.12"
description = "Authorized web vulnerability scanner for bug bounty use"
license = "MIT"

dependencies = [
    "aiohttp>=3.9.0",
    "aiodns>=3.1.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "pyOpenSSL>=24.0.0",
    "cryptography>=42.0.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "jinja2>=3.1.0",
    "pyyaml>=6.0.0",
    "pydantic>=2.6.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "sse-starlette>=1.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-httpserver>=1.0.0",
    "pytest-timeout>=2.3.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "types-beautifulsoup4",
    "types-PyYAML",
    "pip-audit>=2.7.0",
    "bandit>=1.7.0",
]

[project.scripts]
webscanner = "webscanner.main:run"

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = [
    "--cov=webscanner",
    "--cov-report=term-missing",
    "--cov-fail-under=15",
    "--strict-markers",
    "-v",
]
markers = [
    "slow: slow integration/e2e tests",
    "unit: unit tests",
    "integration: integration tests",
    "e2e: end-to-end tests",
]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/webscanner"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "SIM", "TCH"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
